[package]
name = "fresnel-core"
description = "The domain of fresnel: clusters, stores, search and operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
bytes.workspace = true
fastrand.workspace = true
fresnel-net.workspace = true
futures-util.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
imbl.workspace = true
# The check of a time zone of the settings, with the database of the system. Windows has no
# such database, so the program has a copy there (`tzdb-bundle-platform`).
jiff = { workspace = true, features = ["tzdb-bundle-platform", "tzdb-zoneinfo"] }
k8s-openapi.workspace = true
# `ws`: the requests of exec, attach and port forward. The gateway sends the WebSocket
# handshake itself, and `fresnel-net` runs the socket.
kube = { workspace = true, features = ["ws"] }
rustls.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
toml.workspace = true
toml_edit.workspace = true
tower-service.workspace = true
vte.workspace = true
x509-parser.workspace = true

[dev-dependencies]
fresnel-testkit.workspace = true
nix.workspace = true
rcgen.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
