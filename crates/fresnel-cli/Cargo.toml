[package]
name = "fresnel-cli"
description = "Command line program for tests and fault diagnosis of fresnel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
fresnel-core.workspace = true
http.workspace = true
jiff.workspace = true
# The requests of the lists that the soak compares with the stores.
kube.workspace = true
serde.workspace = true
serde_json.workspace = true
# `signal`: the command `watch` runs until Ctrl+C and then stops its tasks. `sync`: the
# soak shares the copy of the core between its tasks. `net` and `io-util`: the check of the
# forward of the soak fetches a page through its local port.
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
base64.workspace = true
fastrand.workspace = true
fresnel-testkit.workspace = true
nix.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process"] }

[[test]]
name = "commands"
path = "tests/commands/main.rs"

[lints]
workspace = true
