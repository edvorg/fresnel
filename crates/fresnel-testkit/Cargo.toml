[package]
name = "fresnel-testkit"
description = "Test kit of fresnel: fault proxy, k3s in Docker and a fake API server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
fastrand.workspace = true
fresnel-net.workspace = true
socket2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }

# The size of the send buffer of a socket, for the reset of the fault proxy.
[target.'cfg(target_vendor = "apple")'.dependencies]
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
