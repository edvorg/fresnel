[package]
name = "fresnel-testkit"
description = "Test kit of fresnel: fault proxy, k3s in Docker and a fake API server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
bytes.workspace = true
fastrand.workspace = true
fresnel-net.workspace = true
futures-util.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "http2", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
rcgen.workspace = true
rustls.workspace = true
socket2.workspace = true
# `rt-multi-thread` and `signal`: the harness of the soak, `src/bin/fresnel-soak`, runs for
# hours and ends its cluster after Ctrl+C.
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls.workspace = true

# The size of the send buffer of a socket, for the reset of the fault proxy.
[target.'cfg(target_vendor = "apple")'.dependencies]
libc.workspace = true

[dev-dependencies]
base64.workspace = true
hyper = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
