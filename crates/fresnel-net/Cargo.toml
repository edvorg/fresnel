[package]
name = "fresnel-net"
description = "The connection layer of fresnel: channels, the credential plugin and the task start function"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
bytes.workspace = true
fastrand.workspace = true
flate2.workspace = true
futures-util.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio"] }
jiff.workspace = true
nix.workspace = true
rustls.workspace = true
serde_json.workspace = true
socket2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-rustls.workspace = true
tower-service.workspace = true

[dev-dependencies]
base64.workspace = true
fresnel-testkit.workspace = true
hyper = { workspace = true, features = ["server"] }
rcgen.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[lints]
workspace = true
