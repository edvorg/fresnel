[package]
name = "fresnel-net"
description = "The connection layer of fresnel: channels, the credential plugin and the task start function"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
bytes.workspace = true
fastrand.workspace = true
flate2.workspace = true
# `sink`: the two halves of a WebSocket, so that a read goes on while a write waits.
futures-util = { workspace = true, features = ["sink"] }
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio"] }
jiff.workspace = true
rustls.workspace = true
serde_json.workspace = true
socket2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
tower-service.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

# `process`: a child process starts with the command of tokio, in a job object.
# `WindowsProgramming`: the interrupt times, for the time that the computer slept.
[target.'cfg(windows)'.dependencies]
tokio = { workspace = true, features = ["process"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
base64.workspace = true
fresnel-testkit.workspace = true
hyper = { workspace = true, features = ["server"] }
rcgen.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[lints]
workspace = true
