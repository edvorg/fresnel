[package]
name = "fresnel-ui"
description = "The egui widgets and views of fresnel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# "Copy value" of a binary value of a Secret or a ConfigMap gives its base64 text.
base64.workspace = true
egui.workspace = true
egui_plot.workspace = true
egui_table.workspace = true
fresnel-core.workspace = true
# The time of day of a journal entry, in the time zone of the system. Windows has no database
# of the time zones, so the program has a copy there (`tzdb-bundle-platform`).
jiff = { workspace = true, features = ["tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
k8s-openapi.workspace = true
# The detail panel reads the parts that each kind has, such as its conditions, from the
# JSON of the object.
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
image.workspace = true
# A made-up certificate chain for the view of a TLS Secret.
rcgen.workspace = true
# The YAML of a manifest for a picture of the tab, as the core writes it.
serde-saphyr.workspace = true
# The fake core of the view tests needs the handle of a runtime for the task start function.
tokio = { workspace = true, features = ["rt"] }

[lints]
workspace = true
