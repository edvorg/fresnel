[package]
name = "fresnel"
description = "The fresnel desktop program"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
eframe.workspace = true
fresnel-core.workspace = true
fresnel-ui.workspace = true
jiff.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

# The activity against App Nap, and the notifications of the system.
[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-user-notifications.workspace = true

# The lock of the process, and the dialog of a start error.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
egui_kittest.workspace = true
fastrand.workspace = true
fresnel-testkit.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros"] }

[[test]]
name = "boot"
path = "tests/boot/main.rs"

[[test]]
name = "finder"
path = "tests/finder/main.rs"

[[test]]
name = "live"
path = "tests/live/main.rs"

[[test]]
name = "settings"
path = "tests/settings/main.rs"

[[test]]
name = "k3s_views"
path = "tests/k3s_views/main.rs"

[[test]]
name = "k3s_metrics"
path = "tests/k3s_metrics/main.rs"

[[test]]
name = "k3s_logs"
path = "tests/k3s_logs/main.rs"

[[test]]
name = "k3s_overview"
path = "tests/k3s_overview/main.rs"

[lints]
workspace = true
