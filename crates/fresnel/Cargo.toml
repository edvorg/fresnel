[package]
name = "fresnel"
description = "The fresnel desktop program"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
eframe.workspace = true
fresnel-core.workspace = true
fresnel-ui.workspace = true
jiff.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

# The activity against App Nap.
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
fastrand.workspace = true
fresnel-testkit.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros"] }

[[test]]
name = "finder"
path = "tests/finder/main.rs"

[[test]]
name = "live"
path = "tests/live/main.rs"

[[test]]
name = "k3s_views"
path = "tests/k3s_views/main.rs"

[[test]]
name = "k3s_metrics"
path = "tests/k3s_metrics/main.rs"

[[test]]
name = "k3s_logs"
path = "tests/k3s_logs/main.rs"

[lints]
workspace = true
