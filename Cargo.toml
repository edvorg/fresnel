[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
repository = "https://github.com/edvorg/fresnel"

# The one version table. A crate takes a dependency with `workspace = true`.
# An exact pin (`=`) has a comment that gives its reason.
[workspace.dependencies]
fresnel-core = { path = "crates/fresnel-core" }
fresnel-net = { path = "crates/fresnel-net" }
fresnel-testkit = { path = "crates/fresnel-testkit" }
fresnel-ui = { path = "crates/fresnel-ui" }

# Runtime and transport. rustls uses ring, so the build needs no C compiler setup.
tokio = { version = "1.53", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
fastrand = "2.5"
hyper = { version = "1.12", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
http = "1.4"
http-body = "1.1"
http-body-util = "0.1.5"
bytes = "1.10"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tower-service = "0.3.3"
socket2 = "0.6.1"

# The parts of `fresnel-net` around the connections.
# gzip of list and GET responses, with the Rust backend of flate2.
flate2 = "1.1"
# The answer of the credential plugin is JSON with an RFC 3339 time.
serde_json = "1.0.150"
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
# A new session and a kill of the process group for each child process, the login shell of
# the user and the interface addresses.
nix = { version = "0.30.1", default-features = false, features = ["net", "process", "signal", "user"] }

# The kubeconfig files of `fresnel-core`: YAML with base64 values. kube reads YAML with the
# same crate.
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "0.0.29"
base64 = "0.22.1"
# The settings file `config.toml`. Its parser gives the place of each key, so a report names
# the line and the column.
toml = { version = "1.1", default-features = false, features = ["parse"] }

# The certificates of a TLS Secret: subject, issuer, validity and names. The parse needs no
# crypto feature. rcgen of the tests uses the same version.
x509-parser = { version = "0.18.1", default-features = false }

# The map of a store. A copy shares each part that did not change, so a snapshot of 10,000
# objects costs no copy. The store prototype measured this crate.
imbl = "7.0.2"
# The escape sequences of a log line: the parser of the terminal of M10 too. `ansi` gives
# each SGR code as a style, so the app decodes no parameter itself.
vte = { version = "0.15.0", default-features = false, features = ["std", "ansi"] }

# Only the test kit and tests use these.
libc = "0.2.180"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }

# Exact pin: `fresnel-net` replaces the transport of kube. Each kube upgrade needs a review of
# `cluster/gateway.rs` in `fresnel-core`. Only `fresnel-core` and the programs can use kube.
kube = { version = "=4.2.0", default-features = false, features = ["client"] }
# `v1_33` is the API version of the k3s image of the tests.
k8s-openapi = { version = "0.28.0", features = ["v1_33"] }

# The egui crates change together. One upgrade moves all of them.
egui = { version = "0.36.2", default-features = false, features = ["default_fonts"] }
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "x11", "wayland"] }
egui_kittest = { version = "0.36.2", features = ["wgpu"] }
# The virtual rows of a table. Only `widgets/table.rs` of `fresnel-ui` uses it.
egui_table = "0.10.0"
# The PNG files of the view tests. egui_kittest gives the image of a frame as this type.
image = { version = "0.25.10", default-features = false, features = ["png"] }

# xtask writes the icon of the app with it. The image crate uses the same version.
png = "0.18.1"

# The macOS activity against App Nap. eframe uses these versions too.
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }

# The one lint table. A crate takes it with `[lints] workspace = true`.
# CI makes each warning an error. `clippy.toml` holds the list for `disallowed_methods`.
[workspace.lints.rust]
unused_must_use = "deny"
# An item is private to its crate unless `lib.rs` exports it.
unreachable_pub = "deny"

[workspace.lints.clippy]
# An ignored result or an ignored future hides an error.
let_underscore_must_use = "deny"
let_underscore_future = "deny"
unused_result_ok = "deny"
# A lock guard in the head of `if let` or `match` lives to the end of the body. A wait or a
# file read in the body then holds the lock, and a reader of a state stops.
significant_drop_in_scrutinee = "deny"
# A panic in a library stops a task. Return the error.
unwrap_used = "deny"
expect_used = "deny"
# Direct calls of `tokio::spawn`: see `clippy.toml`.
disallowed_methods = "deny"
# Each exception to a lint gives its reason.
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
# No unfinished code in the repository.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# The task start function turns a panic into a state and a restart. That needs unwinding.
[profile.dev]
panic = "unwind"

# No debug data for the crates of other projects. A test build of the workspace is then
# small enough for the disk of a CI runner, and a backtrace keeps each function name.
[profile.dev.package."*"]
debug = false

[profile.release]
panic = "unwind"
