# Design rule 9: one function starts all background tasks and watches them.
# A task that starts in a different way has no name, no visible state and no restart.
disallowed-methods = [
    { path = "tokio::task::spawn", reason = "start the task with `fresnel_net::task::Tasks::start`" },
    { path = "tokio::task::spawn_local", reason = "start the task with `fresnel_net::task::Tasks::start`" },
    { path = "tokio::runtime::Handle::spawn", reason = "start the task with `fresnel_net::task::Tasks::start`" },
    { path = "tokio::runtime::Runtime::spawn", reason = "start the task with `fresnel_net::task::Tasks::start`" },
    # A thread is a background task too. `std::thread::scope` is permitted: it joins each thread.
    { path = "std::thread::spawn", reason = "start the thread with `fresnel_net::task::Tasks::start_thread`" },
    { path = "std::thread::Builder::spawn", reason = "start the thread with `fresnel_net::task::Tasks::start_thread`" },
]

# A test can stop with a panic. Library code cannot.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
