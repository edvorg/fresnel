name: ci

on: push

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # No older cache: its build folder would stay in each later one and fill the disk.
          key: check-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}
      # The UI tests draw with wgpu. A Linux runner has no GPU, so Mesa gives a software one.
      - name: Software GPU
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends mesa-vulkan-drivers
      - name: Format
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # One build for the unit tests and the UI tests. A build for one package has other
      # features of the shared crates, and a second copy of them does not fit on the disk.
      - name: Unit tests and UI tests
        run: cargo test --workspace --locked
      - name: Size limits
        run: cargo xtask check-sizes

  # The tests with the attribute `#[ignore]`: k3s in Docker and the fault proxy.
  cluster:
    name: cluster tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cluster-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}
      - name: Cluster tests
        run: cargo test --workspace --locked -- --ignored
