name: ci

on: push

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

# The cache of each job is the build of the dependencies (Swatinem/rust-cache). Its key has
# Cargo.lock; a new lock restores the newest entry of the job with an other lock, so only the
# changed crates build again. Before a save, the action removes the crates of the workspace and
# each crate that left Cargo.lock, so an entry does not grow with each run and fill the disk.
# Only master saves: a branch restores the entries of master, and an entry that a ci/* branch
# saved took room in the 10 GB of the repository that no other branch could read. The bin
# folder of cargo has the proxies of rustup and nothing of ours, so it stays out.

jobs:
  # Windows runs the same checks: the unit tests, the socket tests and the UI tests. A test
  # of the fake plugin or the login shell, shell scripts, is for unix. Each limit holds a run
  # with no cache with room: in run 38763183609 (no cache) macOS took 8 minutes, Windows 52,
  # and Linux 25 for its tests alone, so its limit of 30 ended the save of the cache. A Linux
  # minute costs least, so its limit has the most room.
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.limit }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            limit: 30
          - os: ubuntu-24.04
            limit: 60
          - os: windows-2025
            limit: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The lints and the test build fill the disk of a Linux runner: the linker of the largest
      # test program stopped with a bus error. The tools of other languages need no step here.
      - name: Disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h /
      - name: Toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-bin: "false"
      # The UI tests draw with wgpu. A Linux runner has no GPU, so Mesa gives a software one.
      # Windows has one in Direct3D 12 (WARP).
      - name: Software GPU
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends mesa-vulkan-drivers
      - name: Format
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # One build for the unit tests and the UI tests. A build for one package has other
      # features of the shared crates, and a second copy of them does not fit on the disk.
      # The time tests run in the job `time`: a time limit holds in a release build only.
      # Each test program runs: a failure of one does not hide the results of the others.
      - name: Unit tests and UI tests
        run: cargo test --workspace --locked --no-fail-fast -- --skip frame_time --skip search::time
      - name: Size limits
        run: cargo xtask check-sizes

  # The frame time and the quick search time (plan section 15) in a release build. The
  # limits 16 ms and 50 ms hold on the Mac on which they were set (3 ms and 9 ms there). A
  # shared runner is slower and less steady, so each runner has its own limits: about twice
  # its longest time in the runs of 2026-10-14. Longest frame: macOS 25 ms (one scroll frame,
  # median 1 ms), Linux 15 ms. Longest search: macOS 35 ms, Linux 114 ms (30 to 114 ms in 5
  # runs, so on Linux the check finds only a large regression). Since the pod sections of M3,
  # the first frame of the panel of a pod with extreme values is the longest one: 14 to 31 ms
  # in 8 runs on Linux (median of its frames 1 to 4 ms), 5 to 11 ms on macOS, 6.5 ms on the Mac.
  time:
    name: time (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            frame: 50
            search: 70
          - os: ubuntu-24.04
            frame: 60
            search: 230
    env:
      FRESNEL_FRAME_LIMIT_MS: ${{ matrix.frame }}
      FRESNEL_SEARCH_LIMIT_MS: ${{ matrix.search }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-bin: "false"
      # One test at a time: the frames of a test do not wait for the threads of an other one.
      - name: Time tests in a release build
        run: cargo test --release --locked --package fresnel-ui --test views -- frame_time search::time --nocapture --test-threads 1

  # The tests with the attribute `#[ignore]`: k3s in Docker and the fault proxy. With no cache
  # they took 41 minutes in run 38763183609, near the limit of 45 then.
  cluster:
    name: cluster tests
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The test build fills the disk as in the job `check`, and then kubelet of k3s taints its
      # node with disk pressure: no pod starts, and the save of the cache fails.
      - name: Disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h /
      - name: Toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-bin: "false"
      # Each test program runs: a failure of one does not hide the results of the others.
      - name: Cluster tests
        run: cargo test --workspace --locked --no-fail-fast -- --ignored
