name: release

# Each commit of master that passes the workflow ci makes a release: the app for macOS on Apple
# silicon and the program for Windows x64 of that commit. Its version is the workspace version
# and the run number of this workflow, as in 0.1.0+build.7, and its tag is v0.1.0-build.7. A
# commit with a failed test never becomes the latest release, and a commit that is no longer the
# head of master makes none. GitHub reads the trigger workflow_run from the file on master only;
# a manual run builds the commit of its branch, and only a run on master publishes.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # `cargo xtask` makes the version from it and gives it to the program, the bundle and the
  # version resource of Windows.
  FRESNEL_BUILD: ${{ github.run_number }}
  # The commit that ci tested. The newest commit of master, which a workflow_run gets as its
  # own, can be a later one whose tests did not end yet.
  COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # Only a run of ci that passed, of a push to this repository: a failed or cancelled run (a
  # newer push cancels it) makes no release. A newer run cancels the builds of an older one,
  # which then makes no release either. The job `publish` is in a group of its own, so a
  # release that has begun always ends.
  macos:
    name: build (macOS arm64)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: macos-26
    timeout-minutes: 30
    concurrency:
      group: release-macos-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      # No step pushes, so the checkout keeps no token in .git/config, where the build scripts
      # of the dependencies could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - name: Toolchain of rust-toolchain.toml
        run: rustup toolchain install
      # The cache as in the workflow ci: the dependencies, saved by master only (a workflow_run
      # runs on master).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-bin: "false"
      # The bundle with an ad hoc signature, which `install` checks after it signs, and the license
      # files of fresnel and of the crates and the font in the program in Contents/Resources.
      - name: Fresnel.app
        run: cargo xtask install --to dist
      # ditto keeps the bundle as it is: a plain zip of some tools breaks its signature.
      - name: Zip file
        run: ditto -c -k --keepParent dist/Fresnel.app fresnel-macos-arm64.zip
      # The checks read the content of the zip file, as a user gets it. The licenses of fresnel
      # are the files of the commit, and THIRD-PARTY-LICENSES has the OFL of JetBrains Mono.
      - name: Check the zip file
        id: check
        run: |
          ditto -x -k fresnel-macos-arm64.zip unzipped
          codesign --verify --deep --strict --verbose=2 unzipped/Fresnel.app
          resources=unzipped/Fresnel.app/Contents/Resources
          for file in LICENSE-MIT LICENSE-APACHE; do
            if ! cmp -s "$file" "$resources/$file"; then
              echo "::error::Contents/Resources/$file of Fresnel.app is not $file of the commit"
              exit 1
            fi
          done
          if ! grep -q "SIL OPEN FONT LICENSE Version 1.1" "$resources/THIRD-PARTY-LICENSES"; then
            echo "::error::Fresnel.app has no Contents/Resources/THIRD-PARTY-LICENSES with the OFL"
            exit 1
          fi
          text=$(unzipped/Fresnel.app/Contents/MacOS/fresnel --version)
          if ! [[ "$text" =~ ^fresnel\ ([0-9]+\.[0-9]+\.[0-9]+\+build\.$FRESNEL_BUILD)$ ]]; then
            echo "::error::fresnel --version gives \"$text\""
            exit 1
          fi
          echo "Fresnel.app: $text, with a valid ad hoc signature and its license files"
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          path: fresnel-macos-arm64.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # The same condition as the job `macos`. With no cache the build took 29 minutes in run
  # 38772363310 (macOS: 3), so the limit leaves room for a slow runner.
  windows:
    name: build (Windows x64)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: windows-2025
    timeout-minutes: 45
    concurrency:
      group: release-windows-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      # No step pushes, so the checkout keeps no token in .git/config, where the build scripts
      # of the dependencies could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - name: Toolchain of rust-toolchain.toml
        run: rustup toolchain install
      # The cache as in the job `macos`.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-bin: "false"
      # The program with its icon and its version in its resources, and its license files.
      - name: fresnel.exe
        run: cargo xtask windows --to dist
      - name: Zip file
        shell: pwsh
        run: |
          $files = 'fresnel.exe', 'LICENSE-MIT', 'LICENSE-APACHE', 'THIRD-PARTY-LICENSES' | ForEach-Object { "dist/$_" }
          Compress-Archive -Path $files -DestinationPath fresnel-windows-x64.zip
      # The program has no console: Start-Process waits for its end and keeps its output.
      # ExtractIconEx with the index -1 counts the icons of a file. The license files are next to
      # the program as in the job `macos`.
      - name: Check the zip file
        id: check
        shell: pwsh
        run: |
          Expand-Archive fresnel-windows-x64.zip unzipped
          $names = (Get-ChildItem unzipped | Sort-Object Name | ForEach-Object Name) -join ' '
          if ($names -cne 'fresnel.exe LICENSE-APACHE LICENSE-MIT THIRD-PARTY-LICENSES') { throw "the zip file has $names" }
          foreach ($file in 'LICENSE-MIT', 'LICENSE-APACHE') {
            if ((Get-FileHash "unzipped/$file").Hash -ne (Get-FileHash $file).Hash) { throw "$file of the zip file is not $file of the commit" }
          }
          if (-not (Select-String -Path unzipped/THIRD-PARTY-LICENSES -SimpleMatch 'SIL OPEN FONT LICENSE Version 1.1' -Quiet)) {
            throw 'THIRD-PARTY-LICENSES of the zip file has no OFL'
          }
          $program = (Resolve-Path unzipped/fresnel.exe).Path
          $run = Start-Process $program -ArgumentList '--version' -NoNewWindow -Wait -PassThru -RedirectStandardOutput version.txt
          $text = (Get-Content version.txt -Raw).Trim()
          if ($run.ExitCode -ne 0) { throw "fresnel.exe --version ends with $($run.ExitCode): $text" }
          if ($text -notmatch "^fresnel (\d+\.\d+\.\d+\+build\.$env:FRESNEL_BUILD)$") { throw "fresnel.exe --version gives `"$text`"" }
          $version = $Matches[1]
          $info = (Get-Item $program).VersionInfo
          if ($info.ProductVersion -ne $version -or $info.FileDescription -ne 'Fresnel') {
            throw "the version resource has `"$($info.ProductVersion)`" and `"$($info.FileDescription)`""
          }
          Add-Type -Namespace Shell -Name Icons -MemberDefinition '[DllImport("shell32.dll", CharSet = CharSet.Unicode)] public static extern uint ExtractIconEx(string file, int index, IntPtr[] large, IntPtr[] small, uint count);'
          $icons = [Shell.Icons]::ExtractIconEx($program, -1, $null, $null, 0)
          if ($icons -ne 1) { throw "fresnel.exe has $icons icons" }
          "fresnel.exe: $text, version resource $($info.ProductVersion) of $($info.FileDescription), 1 icon, license files"
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: fresnel-windows-x64.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Only master publishes. A manual run on an other branch, as the test of a change of this
  # file on a ci/* branch, builds and checks the zip files and makes no release: as the newest
  # one it would be the "Latest" release, which `gh release download` gets, and it would push a
  # release of master out of the 20 that stay. A workflow_run has the ref of master.
  publish:
    name: release
    needs: [macos, windows]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-publish-${{ github.ref }}
    permissions:
      contents: write
    # The token that may write is in the steps of gh alone, not in the actions or in git.
    env:
      VERSION: ${{ needs.macos.outputs.version }}
      WINDOWS_VERSION: ${{ needs.windows.outputs.version }}
    steps:
      # The notes need the history and the tags of the earlier releases.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: zips
          merge-multiple: true
      # Only the head of master publishes, so an older build never becomes "Latest" after a newer
      # one. The tag of an older commit whose workflow files differ from master needs the
      # permission workflows, which the token has not: run 38985614286 failed with HTTP 403. The
      # newer commit makes the release after its ci. The repository is private, so a `git
      # ls-remote` would need the token that may write in git; gh reads the head instead.
      - name: Head of master
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          if ! [[ "$head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the head of master is \"$head\""
            exit 1
          fi
          if [ "$head" = "$COMMIT" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$COMMIT is no longer the head of master: $head makes the release after its ci"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      # The commits since the tag of the release before, which is the nearest one in the history.
      - name: Notes
        if: steps.head.outputs.current == 'true'
        run: |
          if [ "$VERSION" != "$WINDOWS_VERSION" ]; then
            echo "::error::the macOS build is $VERSION and the Windows build is $WINDOWS_VERSION"
            exit 1
          fi
          echo "TAG=v${VERSION/+/-}" >> "$GITHUB_ENV"
          previous=$(git describe --tags --abbrev=0 --match 'v*-build.*' HEAD 2>/dev/null || true)
          if [ -n "$previous" ]; then
            echo "Commits since $previous:" > notes.md
            git log --format='- %s (%h)' "$previous..HEAD" > commits.txt
          else
            echo "The first release. Its commits:" > notes.md
            git log --format='- %s (%h)' HEAD > commits.txt
          fi
          count=$(wc -l < commits.txt)
          echo >> notes.md
          head -n 50 commits.txt >> notes.md
          if [ "$count" -gt 50 ]; then echo "- and $((count - 50)) earlier commits" >> notes.md; fi
          if [ "$count" -eq 0 ]; then echo "- no new commit" >> notes.md; fi
          cat notes.md
      - name: Release
        if: steps.head.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" zips/fresnel-macos-arm64.zip zips/fresnel-windows-x64.zip \
            --target "$COMMIT" --title "Fresnel $VERSION" --notes-file notes.md --latest
      # Each zip file of the release downloads, with the bytes of the build.
      - name: Check the download
        if: steps.head.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --dir downloaded
          (cd zips && sha256sum fresnel-macos-arm64.zip fresnel-windows-x64.zip) > sums.txt
          (cd downloaded && sha256sum --check ../sums.txt)
      # Only the releases of this workflow: a tag of an other form stays.
      - name: Keep the 20 newest releases
        if: steps.head.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --exclude-drafts --json tagName,createdAt --jq '
            [.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-build\\.[0-9]+$"))]
            | sort_by(.createdAt) | reverse | .[20:][] | .tagName' > old.txt
          while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done < old.txt
